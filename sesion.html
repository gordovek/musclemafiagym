<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon2.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon2.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Iniciar Sesión | MUSCLE MAFIA GYM</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Barlow Condensed', sans-serif; }

    input::placeholder {
      color: #a1a1aa;
      opacity: 0.4;
    }

    input:focus { border-color: #FFD600; outline: none; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes glitch-effect {
      0% { transform: translate(0) skew(0deg); filter: none; }
      15% { transform: translate(-3px, 1px) skew(-3deg); filter: drop-shadow(3px -1px 0 #FFD600) drop-shadow(-3px 1px 0 #ef4444); }
      17% { transform: translate(0) skew(0deg); filter: none; }
      40% { transform: translate(4px, -2px) skew(4deg); filter: drop-shadow(-3px -1px 0 #FFD600); }
      43% { transform: translate(0) skew(0deg); filter: none; }
      65% { transform: translate(-2px, 2px) skew(-2deg); filter: drop-shadow(3px 1px 0 #ef4444); }
      67% { transform: translate(0) skew(0deg); filter: none; }
      85% { transform: translate(3px, -1px) skew(2deg); filter: drop-shadow(-2px 2px 0 #FFD600) drop-shadow(2px -1px 0 #ef4444); }
      88% { transform: translate(0) skew(0deg); filter: none; }
      100% { transform: translate(0) skew(0deg); filter: none; }
    }

    .glitch-logo {
      animation: glitch-effect 1.2s infinite steps(1);
    }
  </style>
</head>

<body style="background:#050505; margin:0; display:flex; justify-content:center; align-items:center; min-height:100svh;">

  <!-- LOADER -->
  <div id="loader-screen" style="position:fixed; inset:0; background:#050505; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; transition:opacity 0.3s ease;">
    <img src="LOGOALT.png" alt="Muscle Mafia Logo" class="glitch-logo" style="height:48px; width:auto; margin-bottom:20px; object-fit:contain;">
    <div style="width:28px; height:28px; border:3px solid #27272a; border-top-color:#FFD600; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
  </div>

  <div style="width:100%; max-width:448px; background:#0a0a0a; border:1px solid #27272a; display:flex; flex-direction:column; position:relative; overflow:hidden; height:100svh; max-height:844px;">

    <!-- HEADER -->
    <header style="background:#0a0a0a; border-bottom:1px solid #3f3f46; display:flex; justify-content:center; align-items:center; padding:16px 20px; flex-shrink:0;">
      <a href="index.html">
        <img src="LOGOALT.png" alt="Muscle Mafia Logo" style="height:32px; width:auto; object-fit:contain; display:block;">
      </a>
    </header>

    <!-- MAIN CONTENT -->
    <main style="flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; justify-content:center;">
      
      <p class="font-display" style="font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:#FFD600; margin:0 0 4px;">Muscle Mafia</p>
      <h2 class="font-display" style="font-size:2.5rem; font-weight:900; text-transform:uppercase; color:#fff; margin:0 0 24px; letter-spacing:-0.02em;">Iniciar Sesión</h2>

      <form id="auth-form" onsubmit="event.preventDefault(); iniciarSesion();" style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <label style="font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:#52525b; display:block; margin-bottom:6px;">Correo Electrónico</label>
          <input type="email" id="auth-email" placeholder="usuario@correo.com" required
            style="width:100%; box-sizing:border-box; background:#0f0f0f; border:1px solid #3f3f46; padding:12px; font-size:14px; color:#f4f4f5; font-family:'Inter',sans-serif; transition:border-color 0.2s;"
            onfocus="this.style.borderColor='#FFD600'" onblur="this.style.borderColor='#3f3f46'">
        </div>
        <div>
          <label style="font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:#52525b; display:block; margin-bottom:6px;">Contraseña</label>
          <input type="password" id="auth-password" placeholder="••••••••" required
            style="width:100%; box-sizing:border-box; background:#0f0f0f; border:1px solid #3f3f46; padding:12px; font-size:14px; color:#f4f4f5; font-family:'Inter',sans-serif; transition:border-color 0.2s;"
            onfocus="this.style.borderColor='#FFD600'" onblur="this.style.borderColor='#3f3f46'">
        </div>

        <div id="auth-error" style="display:none; font-size:12px; color:#f87171; background:rgba(239,68,68,0.05); border:1px solid rgba(239,68,68,0.2); padding:10px 12px;"></div>

        <button id="btn-submit" type="submit" class="font-display"
          style="width:100%; padding:14px; font-weight:900; font-size:0.9rem; letter-spacing:0.12em; text-transform:uppercase; background:#FFD600; color:#0a0a0a; border:none; cursor:pointer; transition:opacity 0.15s; margin-top:8px;">
          ENTRAR A MI CUENTA
        </button>
      </form>

      <div style="border-top:1px solid #3f3f46; margin-top:28px; padding-top:20px; text-align:center;">
        <p style="font-size:12px; color:#71717a; margin:0;">
          ¿No tienes una cuenta aún? 
          <a href="index.html" style="color:#FFD600; text-decoration:none; font-weight:600;">Regístrate aquí</a>
        </p>
      </div>

    </main>

  </div>

  <script>
    const SUPABASE_URL = "https://ywiormfjngrbkatruyya.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3aW9ybWZqbmdyYmthdHJ1eXlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODYwNDAsImV4cCI6MjE0MjY2MjA0MH0.Y9JEA2UjLRBt9rib6e9a_UcFL_tai1P5EFmm03ghwzk";
    let db;

    function ocultarLoader() {
      const loader = document.getElementById('loader-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 300);
      }
    }

    async function iniciarSesion() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const btn = document.getElementById('btn-submit');
      const errEl = document.getElementById('auth-error');
      
      errEl.style.display = 'none';

      if (!email || !password) {
        showError('Por favor ingresa tu correo y contraseña.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'VERIFICANDO...';
      btn.style.opacity = '0.6';

      try {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) throw error;

        window.location.href = 'index.html';
      } catch (e) {
        showError(e.message || 'Error al iniciar sesión.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'ENTRAR A MI CUENTA';
        btn.style.opacity = '1';
      }
    }

    function showError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    window.onload = async () => {
      try {
        if (typeof supabase !== 'undefined') {
          db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          const { data: { session } } = await db.auth.getSession();
          if (session) {
            window.location.href = 'index.html';
            return;
          }
        }
      } catch (e) {
        console.error("Error al inicializar sesión:", e);
      } finally {
        ocultarLoader();
      }
    };
  </script>
</body>
</html>
