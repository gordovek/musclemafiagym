<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Favicon estándar con rutas relativas para GitHub Pages -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon2.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Para dispositivos móviles Apple (iOS) -->
  <link rel="apple-touch-icon" sizes="180x180" href="favicon2.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MUSCLE MAFIA GYM - Panel Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Barlow Condensed', sans-serif; }
    .pb-safe { padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }

    /* Estilo para reducir la opacidad del placeholder de los inputs */
    input::placeholder {
      color: #a1a1aa;
      opacity: 0.4;
    }

    /* Input focus */
    input:focus, select:focus { border-color: #FFD600; outline: none; }

    /* Animación para el Loader */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* EFECTO GLITCH EN LOGO LOADER */
    @keyframes glitch-effect {
      0% { transform: translate(0) skew(0deg); filter: none; }
      15% { transform: translate(-3px, 1px) skew(-3deg); filter: drop-shadow(3px -1px 0 #FFD600) drop-shadow(-3px 1px 0 #ef4444); }
      17% { transform: translate(0) skew(0deg); filter: none; }
      40% { transform: translate(4px, -2px) skew(4deg); filter: drop-shadow(-3px -1px 0 #FFD600); }
      43% { transform: translate(0) skew(0deg); filter: none; }
      65% { transform: translate(-2px, 2px) skew(-2deg); filter: drop-shadow(3px 1px 0 #ef4444); }
      67% { transform: translate(0) skew(0deg); filter: none; }
      85% { transform: translate(3px, -1px) skew(2deg); filter: drop-shadow(-2px 2px 0 #FFD600) drop-shadow(2px -1px 0 #ef4444); }
      88% { transform: translate(0) skew(0deg); filter: none; }
      100% { transform: translate(0) skew(0deg); filter: none; }
    }

    .glitch-logo {
      animation: glitch-effect 1.2s infinite steps(1);
    }
  </style>
</head>

<body style="background:#050505; margin:0; display:flex; justify-content:center; align-items:center; min-height:100svh;">

  <!-- PANTALLA DE CARGA INICIAL -->
  <div id="loader-screen" style="position:fixed; inset:0; background:#050505; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; transition:opacity 0.3s ease;">
    <img src="LOGOALT.png" alt="Muscle Mafia Logo" class="glitch-logo" style="height:48px; width:auto; margin-bottom:20px; object-fit:contain;">
    <div style="width:28px; height:28px; border:3px solid #27272a; border-top-color:#FFD600; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
  </div>

  <!-- CONTAINER DE LA APLICACIÓN -->
  <div style="width:100%; max-width:800px; background:#0a0a0a; border:1px solid #27272a; display:flex; flex-direction:column; position:relative; overflow:hidden; min-height:100svh; max-height:100svh;">

    <!-- HEADER -->
    <header style="background:#0a0a0a; border-bottom:1px solid #3f3f46; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:12px 20px; flex-shrink:0; z-index:10;">
      <div>
        <span class="font-display" style="font-size:12px; font-weight:900; letter-spacing:0.15em; text-transform:uppercase; color:#FFD600;">PANEL ADMIN</span>
      </div>
      <!-- LOGO EN IMAGEN -->
      <div style="display:flex; justify-content:center; align-items:center;">
        <img src="LOGOALT.png" alt="Muscle Mafia Logo" style="height:32px; width:auto; object-fit:contain; display:block;">
      </div>
      <div style="display:flex; justify-content:flex-end; align-items:center; gap:6px;">
        <button onclick="cargarUsuarios()" class="font-display" style="background:#18181b; border:1px solid #3f3f46; color:#FFD600; padding:6px 12px; font-size:11px; font-weight:900; letter-spacing:0.1em; cursor:pointer; text-transform:uppercase; transition:all 0.2s;">
          🔄 ACTUALIZAR
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main style="flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:20px;" id="main-content">

      <!-- STATS BAR -->
      <div style="border:1px solid #3f3f46; background:#0f0f0f; display:grid; grid-template-columns:1fr 1fr 1fr;">
        <div style="padding:14px; text-align:center; border-right:1px solid #3f3f46;">
          <div id="stat-total" class="font-display" style="font-size:1.6rem; font-weight:900; color:#fff;">0</div>
          <div style="font-size:9px; color:#71717a; text-transform:uppercase; letter-spacing:0.12em; margin-top:2px;">Total Usuarios</div>
        </div>
        <div style="padding:14px; text-align:center; border-right:1px solid #3f3f46;">
          <div id="stat-activos" class="font-display" style="font-size:1.6rem; font-weight:900; color:#22c55e;">0</div>
          <div style="font-size:9px; color:#71717a; text-transform:uppercase; letter-spacing:0.12em; margin-top:2px;">Activos</div>
        </div>
        <div style="padding:14px; text-align:center;">
          <div id="stat-vencidos" class="font-display" style="font-size:1.6rem; font-weight:900; color:#ef4444;">0</div>
          <div style="font-size:9px; color:#71717a; text-transform:uppercase; letter-spacing:0.12em; margin-top:2px;">Vencidos</div>
        </div>
      </div>

      <!-- FORMULARIO REGISTRO / EDICIÓN -->
      <section style="border:1px solid #3f3f46; background:#0f0f0f; padding:18px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid #27272a; padding-bottom:8px;">
          <div>
            <p class="font-display" style="font-size:10px; letter-spacing:0.25em; text-transform:uppercase; color:#FFD600; margin:0;">Gestión de Membresías</p>
            <h2 id="form-title" class="font-display" style="font-size:1.4rem; font-weight:900; text-transform:uppercase; color:#fff; margin:0;">REGISTRAR NUEVO USUARIO</h2>
          </div>
          <button type="button" id="cancel-btn" onclick="limpiarFormulario()" style="display:none; background:transparent; border:1px solid #52525b; color:#a1a1aa; font-size:10px; padding:4px 8px; font-weight:700; cursor:pointer;" class="font-display">
            CANCELAR
          </button>
        </div>

        <form id="user-form" onsubmit="event.preventDefault(); guardarUsuario();" style="display:flex; flex-direction:column; gap:12px;">
          <input type="hidden" id="user-id">

          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px;">
            <div>
              <label style="font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:#71717a; display:block; margin-bottom:4px;">Nombre Completo</label>
              <input type="text" id="nombre" placeholder="Ej. Carlos López" required
                style="width:100%; box-sizing:border-box; background:#0a0a0a; border:1px solid #3f3f46; padding:8px 10px; font-size:13px; color:#f4f4f5; font-family:'Inter',sans-serif;">
            </div>

            <div>
              <label style="font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:#71717a; display:block; margin-bottom:4px;">Correo Electrónico</label>
              <input type="email" id="email" placeholder="usuario@correo.com" required
                style="width:100%; box-sizing:border-box; background:#0a0a0a; border:1px solid #3f3f46; padding:8px 10px; font-size:13px; color:#f4f4f5; font-family:'Inter',sans-serif;">
            </div>

            <div>
              <label style="font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:#71717a; display:block; margin-bottom:4px;">Fecha de Vencimiento</label>
              <input type="date" id="fecha_vencimiento" required
                style="width:100%; box-sizing:border-box; background:#0a0a0a; border:1px solid #3f3f46; padding:8px 10px; font-size:13px; color:#f4f4f5; font-family:'Inter',sans-serif;">
            </div>
          </div>

          <button type="submit" id="submit-btn" class="font-display"
            style="width:100%; padding:10px; font-weight:900; font-size:0.85rem; letter-spacing:0.12em; text-transform:uppercase; background:#FFD600; color:#0a0a0a; border:none; cursor:pointer; margin-top:4px;">
            GUARDAR USUARIO
          </button>
        </form>
      </section>

      <!-- BARRA DE BÚSQUEDA Y FILTRO -->
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <input type="text" id="search-input" oninput="filtrarUsuarios()" placeholder="Buscar por nombre o correo..."
          style="flex:1; min-width:180px; box-sizing:border-box; background:#0f0f0f; border:1px solid #3f3f46; padding:8px 12px; font-size:12px; color:#f4f4f5; font-family:'Inter',sans-serif;">
        <select id="filter-status" onchange="filtrarUsuarios()"
          style="background:#0f0f0f; border:1px solid #3f3f46; padding:8px 12px; font-size:12px; color:#f4f4f5; font-family:'Inter',sans-serif; cursor:pointer;">
          <option value="todos">TODOS LOS ESTADOS</option>
          <option value="activos">ACTIVOS</option>
          <option value="vencidos">VENCIDOS</option>
        </select>
      </div>

      <!-- LISTA DE USUARIOS (TARJETAS EN MÓVIL, TABLA EN ESCRITORIO) -->
      <section style="border:1px solid #3f3f46; background:#0f0f0f; overflow:hidden;">
        <div style="padding:12px 16px; border-bottom:1px solid #27272a; display:flex; justify-content:space-between; align-items:center;">
          <h3 class="font-display" style="font-size:1.1rem; font-weight:900; text-transform:uppercase; color:#fff; margin:0; letter-spacing:-0.01em;">Lista de Miembros</h3>
          <span id="user-count-badge" style="font-size:10px; color:#71717a; font-family:monospace;">0 registros</span>
        </div>

        <div id="users-container">
          <div style="padding:24px; text-align:center; color:#71717a; font-size:12px;">Cargando usuarios...</div>
        </div>
      </section>

    </main>

  </div>

  <script>
    const SUPABASE_URL = "https://ywiormfjngrbkatruyya.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3aW9ybWZqbmdyYmthdHJ1eXlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODYwNDAsImV4cCI6MjEwMjY2MjA0MH0.Y9JEA2UjLRBt9rib6e9a_UcFL_tai1P5EFmm03ghwzk";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let usuariosData = [];

    function cap(str) {
      if (!str) return '';
      return str.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\'").replace(/"/g, '&quot;');
    }

    // Inicializar fecha por defecto (+1 mes a partir de hoy)
    const fechaDefault = new Date();
    fechaDefault.setMonth(fechaDefault.getMonth() + 1);
    document.getElementById('fecha_vencimiento').value = fechaDefault.toISOString().split('T')[0];

    async function cargarUsuarios() {
      const container = document.getElementById('users-container');
      container.innerHTML = '<div style="padding:24px; text-align:center; color:#71717a; font-size:12px;">Cargando...</div>';

      const { data: usuarios, error } = await db
        .from('usuarios')
        .select('*')
        .order('fecha_vencimiento', { ascending: true });

      if (error) {
        console.error('Error al cargar:', error);
        container.innerHTML = `<div style="padding:24px; text-align:center; color:#ef4444; font-size:12px;">Error al cargar datos: ${error.message}</div>`;
        return;
      }

      usuariosData = usuarios || [];
      actualizarStats();
      filtrarUsuarios();
    }

    function actualizarStats() {
      const hoy = new Date();
      let total = usuariosData.length;
      let activos = 0;
      let vencidos = 0;

      usuariosData.forEach(u => {
        const vencimiento = u.fecha_vencimiento ? new Date(u.fecha_vencimiento) : new Date(0);
        const estaActivo = (u.estado_pago === true || u.estado_pago === 'true' || u.estado_pago === 'TRUE') && vencimiento >= hoy;
        if (estaActivo) activos++;
        else vencidos++;
      });

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-activos').textContent = activos;
      document.getElementById('stat-vencidos').textContent = vencidos;
    }

    function filtrarUsuarios() {
      const search = document.getElementById('search-input').value.toLowerCase().trim();
      const statusFilter = document.getElementById('filter-status').value;
      const hoy = new Date();

      const filtrados = usuariosData.filter(u => {
        const nombre = (u.nombre || '').toLowerCase();
        const email = (u.email || '').toLowerCase();
        const coincideBusqueda = nombre.includes(search) || email.includes(search);

        const vencimiento = u.fecha_vencimiento ? new Date(u.fecha_vencimiento) : new Date(0);
        const estaActivo = (u.estado_pago === true || u.estado_pago === 'true' || u.estado_pago === 'TRUE') && vencimiento >= hoy;

        if (statusFilter === 'activos') return coincideBusqueda && estaActivo;
        if (statusFilter === 'vencidos') return coincideBusqueda && !estaActivo;
        return coincideBusqueda;
      });

      renderizarLista(filtrados);
    }

    function renderizarLista(lista) {
      const container = document.getElementById('users-container');
      document.getElementById('user-count-badge').textContent = `${lista.length} registros`;

      if (lista.length === 0) {
        container.innerHTML = '<div style="padding:24px; text-align:center; color:#71717a; font-size:12px;">No se encontraron usuarios.</div>';
        return;
      }

      const hoy = new Date();

      let html = '<div style="display:flex; flex-direction:column; divide-y:1px solid #27272a;">';

      lista.forEach(u => {
        const vencimiento = u.fecha_vencimiento ? new Date(u.fecha_vencimiento) : new Date(0);
        const estaActivo = (u.estado_pago === true || u.estado_pago === 'true' || u.estado_pago === 'TRUE') && vencimiento >= hoy;

        const fEmision = u.fecha_emision ? u.fecha_emision.toString().split('T')[0] : 'N/A';
        const fVencimiento = u.fecha_vencimiento ? u.fecha_vencimiento.toString().split('T')[0] : 'N/A';

        const colorEstado = estaActivo ? '#22c55e' : '#ef4444';
        const bgBadge = estaActivo ? 'rgba(34,197,94,0.08)' : 'rgba(239,68,68,0.08)';
        const borderBadge = estaActivo ? 'rgba(34,197,94,0.2)' : 'rgba(239,68,68,0.2)';
        const textoEstado = estaActivo ? 'ACTIVO' : 'VENCIDO';

        html += `
          <div style="padding:14px 16px; border-bottom:1px solid #1f1f22; display:flex; flex-direction:column; gap:10px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
              <div>
                <p class="font-display" style="font-size:1.1rem; font-weight:900; text-transform:uppercase; color:#fff; margin:0; line-height:1.1;">
                  ${cap(u.nombre || 'Sin Nombre')}
                </p>
                <p style="font-size:11px; color:#a1a1aa; margin:3px 0 0;">${u.email || 'Sin correo'}</p>
              </div>
              <div style="padding:3px 8px; background:${bgBadge}; border:1px solid ${borderBadge}; font-size:9px; font-weight:900; color:${colorEstado}; border-radius:2px;" class="font-display">
                ${textoEstado}
              </div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; background:#050505; padding:8px 10px; border:1px solid #27272a; font-size:10px; color:#71717a;">
              <div>
                <span>REGISTRO: </span><span style="color:#d4d4d8;">${fEmision}</span>
              </div>
              <div>
                <span>VENCE: </span><span style="color:${estaActivo ? '#FFD600' : '#ef4444'}; font-weight:700;">${fVencimiento}</span>
              </div>
            </div>

            <!-- ACCIONES -->
            <div style="display:flex; gap:6px; margin-top:2px;">
              <button onclick="renovarMes('${u.id}', '${u.fecha_vencimiento}')" class="font-display"
                style="flex:1; background:rgba(255,214,0,0.08); border:1px solid rgba(255,214,0,0.3); color:#FFD600; padding:6px; font-size:10px; font-weight:900; letter-spacing:0.08em; cursor:pointer; text-transform:uppercase;">
                +30 DÍAS
              </button>
              <button onclick="prepararEdicion('${u.id}', '${escapeQuotes(u.nombre || '')}', '${u.email || ''}', '${fVencimiento}')" class="font-display"
                style="background:#18181b; border:1px solid #3f3f46; color:#d4d4d8; padding:6px 12px; font-size:10px; font-weight:900; letter-spacing:0.08em; cursor:pointer; text-transform:uppercase;">
                EDITAR
              </button>
              <button onclick="eliminarUsuario('${u.id}')" class="font-display"
                style="background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.2); color:#ef4444; padding:6px 10px; font-size:10px; font-weight:900; letter-spacing:0.08em; cursor:pointer; text-transform:uppercase;">
                ELIMINAR
              </button>
            </div>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    async function guardarUsuario() {
      const id = document.getElementById('user-id').value;
      const nombre = cap(document.getElementById('nombre').value.trim());
      const email = document.getElementById('email').value.trim();
      const fecha_vencimiento = new Date(document.getElementById('fecha_vencimiento').value).toISOString();

      const btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.style.opacity = '0.6';

      if (id) {
        // Actualizar existente
        const { error } = await db
          .from('usuarios')
          .update({ nombre, email, fecha_vencimiento, estado_pago: true })
          .eq('id', id);

        if (error) alert('Error al actualizar: ' + error.message);
      } else {
        // Insertar nuevo
        const { error } = await db
          .from('usuarios')
          .insert([{
            nombre,
            email,
            fecha_vencimiento,
            fecha_emision: new Date().toISOString(),
            estado_pago: true
          }]);

        if (error) alert('Error al crear: ' + error.message);
      }

      btn.disabled = false; btn.style.opacity = '1';
      limpiarFormulario();
      cargarUsuarios();
    }

    async function renovarMes(userId, fechaActualStr) {
      let baseFecha = new Date();
      if (fechaActualStr && fechaActualStr !== 'null') {
        const fechaActual = new Date(fechaActualStr);
        if (fechaActual > baseFecha) {
          baseFecha = fechaActual;
        }
      }
      baseFecha.setDate(baseFecha.getDate() + 30);

      const { error } = await db
        .from('usuarios')
        .update({
          estado_pago: true,
          fecha_vencimiento: baseFecha.toISOString()
        })
        .eq('id', userId);

      if (error) alert('Error al renovar: ' + error.message);
      else cargarUsuarios();
    }

    function prepararEdicion(id, nombre, email, fechaVencimiento) {
      document.getElementById('user-id').value = id;
      document.getElementById('nombre').value = nombre;
      document.getElementById('email').value = email;
      document.getElementById('fecha_vencimiento').value = fechaVencimiento;

      document.getElementById('form-title').innerText = 'EDITAR USUARIO';
      document.getElementById('submit-btn').innerText = 'ACTUALIZAR USUARIO';
      document.getElementById('cancel-btn').style.display = 'inline-block';
      
      // Scroll smooth al formulario
      document.getElementById('user-form').scrollIntoView({ behavior: 'smooth' });
    }

    async function eliminarUsuario(userId) {
      if (!confirm('¿Seguro que deseas eliminar este usuario?')) return;

      const { error } = await db
        .from('usuarios')
        .delete()
        .eq('id', userId);

      if (error) alert('Error al eliminar: ' + error.message);
      else cargarUsuarios();
    }

    function limpiarFormulario() {
      document.getElementById('user-id').value = '';
      document.getElementById('user-form').reset();

      const fechaDefault = new Date();
      fechaDefault.setMonth(fechaDefault.getMonth() + 1);
      document.getElementById('fecha_vencimiento').value = fechaDefault.toISOString().split('T')[0];

      document.getElementById('form-title').innerText = 'REGISTRAR NUEVO USUARIO';
      document.getElementById('submit-btn').innerText = 'GUARDAR USUARIO';
      document.getElementById('cancel-btn').style.display = 'none';
    }

    window.onload = async () => {
      const startTime = Date.now();
      await cargarUsuarios();
      const elapsedTime = Date.now() - startTime;
      const remainingTime = Math.max(0, 1000 - elapsedTime);

      setTimeout(() => {
        const loader = document.getElementById('loader-screen');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 300);
        }
      }, remainingTime);
    };
  </script>
</body>
</html>
